[project]
name = "news-sentiment-report"
version = "1.0.0"
description = "A tool that fetches daily news for specified companies and uses Claude AI to generate sentiment analysis reports"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Claude AI", email = "noreply@anthropic.com"}
]
keywords = ["news", "sentiment-analysis", "claude", "ai", "reporting", "finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "anthropic>=0.39.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "newsapi-python>=0.2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

# [project.scripts]
# Uncomment if you want to install as a package:
# news-sentiment = "main:main"

[project.urls]
Homepage = "https://github.com/yourusername/news-sentiment-report"
Documentation = "https://github.com/yourusername/news-sentiment-report#readme"
Repository = "https://github.com/yourusername/news-sentiment-report"
Issues = "https://github.com/yourusername/news-sentiment-report/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = []

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = []
